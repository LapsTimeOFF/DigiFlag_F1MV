name: 🐛 Pixoo 64 Issue
description: Report a problem or bug related to Divoom Pixoo 64 hardware integration with DigiFlag
title: '[Pixoo 64 Bug]: '
labels: [bug, pixoo64]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Use this template to report any issues specific to the Divoom Pixoo 64 device when used with DigiFlag.

        ---

        **Before reporting an issue, please try these steps:**
        You need to download the official Divoom smartphone app to upgrade the Pixoo firmware and connect it to WiFi. The Pixoo 64 and your MultiViewer must be on the same WiFi network.
        You can visit this URL on your home network where your Pixoo is located to see your Pixoo device information:
        [https://app.divoom-gz.com/Device/ReturnSameLANDevice](https://app.divoom-gz.com/Device/ReturnSameLANDevice)
        Please download the app, update the Pixoo firmware, and reboot the Pixoo a few times. If issues persist, please include details below.

  - type: input
    id: summary
    attributes:
      label: Issue Summary
      description: Provide a short description of the problem.
      placeholder: e.g., Pixoo 64 will not connect to DigiFlag

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Describe the steps to reproduce the problem with Pixoo 64.
      placeholder: |
        1. Power on Pixoo 64
        2. Open DigiFlag
        3. Try to connect Pixoo 64
        4. Connection fails
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected Pixoo 64 to do?
      placeholder: Device should connect and display flags properly.

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happens with Pixoo 64?
      placeholder: Device fails to connect or shows errors.

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How critical is this problem with Pixoo 64?
      options:
        - Critical (device unusable)
        - Major (major impact)
        - Minor (small issue)
        - Trivial (cosmetic or minor annoyance)

  - type: input
    id: pixoo_firmware
    attributes:
      label: Pixoo 64 Firmware Version
      description: Provide Pixoo 64 firmware version if known.
      placeholder: e.g., v1.2.3

  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Attach any Pixoo 64 device logs or screenshots of errors.
      placeholder: Drag and drop files or paste logs here.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing Pixoo 64 issues
        - label: I have provided all relevant details about the Pixoo 64
